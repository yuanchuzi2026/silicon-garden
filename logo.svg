<line class="rim r2" x1="100" y1="140" x2="100" y2="100"/>
<line class="rim r3" x1="108" y1="108" x2="132" y2="108"/>
<line class="rim r3" x1="132" y1="108" x2="132" y2="132"/>
<line class="rim r3" x1="132" y1="132" x2="108" y2="132"/>
<line class="rim r3" x1="108" y1="132" x2="108" y2="108"/>
<line class="spine" x1="64" y1="64" x2="120" y2="120"/>
<line class="spine" x1="176" y1="64" x2="120" y2="120"/>
<line class="spine" x1="176" y1="176" x2="120" y2="120"/>
<line class="spine" x1="64" y1="176" x2="120" y2="120"/>
<line class="spine" x1="120" y1="64" x2="120" y2="120"/>
<line class="spine" x1="176" y1="120" x2="120" y2="120"/>
<line class="spine" x1="120" y1="176" x2="120" y2="120"/>
<line class="spine" x1="64" y1="120" x2="120" y2="120"/>
<circle class="nd a1" cx="64" cy="64" r="3.4" filter="url(#ng)"/>
<circle class="nd a2" cx="176" cy="64" r="3.4" filter="url(#ng)"/>
<circle class="nd a3" cx="176" cy="176" r="3.4" filter="url(#ng)"/>
<circle class="nd a4" cx="64" cy="176" r="3.4" filter="url(#ng)"/>
<circle class="nd a5" cx="88" cy="88" r="2.8" filter="url(#ng)"/>
<circle class="nd a6" cx="152" cy="88" r="2.8" filter="url(#ng)"/>
<circle class="nd a7" cx="152" cy="152" r="2.8" filter="url(#ng)"/>
<circle class="nd a8" cx="88" cy="152" r="2.8" filter="url(#ng)"/>
<circle class="nd a9" cx="100" cy="100" r="2.2" filter="url(#ng)"/>
<circle class="nd a10" cx="140" cy="100" r="2.2" filter="url(#ng)"/>
<circle class="nd a11" cx="140" cy="140" r="2.2" filter="url(#ng)"/>
