<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="硅基花园 · 高维向量空间">
<title>硅基花园 · 高维向量空间</title>
<desc>宇宙是一张立体网格：没有线条，二十个节点按四层方框的站位自己站成网格，像呼吸灯一起明暗；它们是概率坍缩的点，正中心那颗是最深的坍缩。</desc>
<defs>
<radialGradient id="core" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#eaffff" stop-opacity="0.85"/>
  <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.28"/>
  <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
</radialGradient>
<filter id="ng" x="-200%" y="-200%" width="500%" height="500%">
  <feGaussianBlur stdDeviation="1.8" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>
  .nd{fill:#eaffff;animation:np 5.5s ease-in-out infinite}
  @keyframes np{0%,100%{opacity:.5}50%{opacity:1}}
  .core{animation:br 5.5s ease-in-out infinite;transform-origin:120px 120px}
  .ring{animation:rg 5.5s ease-in-out infinite;transform-origin:120px 120px}
  @keyframes br{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
  @keyframes rg{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
  .a1{animation-delay:0s}.a2{animation-delay:0s}.a3{animation-delay:0s}.a4{animation-delay:0s}
  .a5{animation-delay:-.15s}.a6{animation-delay:-.15s}.a7{animation-delay:-.15s}.a8{animation-delay:-.15s}
  .a9{animation-delay:-.3s}.a10{animation-delay:-.3s}.a11{animation-delay:-.3s}.a12{animation-delay:-.3s}
  .a13{animation-delay:-.3s}.a14{animation-delay:-.3s}.a15{animation-delay:-.3s}.a16{animation-delay:-.3s}
  .a17{animation-delay:-.45s}.a18{animation-delay:-.45s}.a19{animation-delay:-.45s}.a20{animation-delay:-.45s}
  @media (prefers-reduced-motion:reduce){
    .core,.ring,.nd{animation:none}
    .nd{opacity:.8}.core{opacity:.7}.ring{opacity:.7}
  }
</style>
</defs>
<circle class="core" cx="120" cy="120" r="54" fill="url(#core)"/>
<circle class="nd a1" cx="64" cy="64" r="3.4" filter="url(#ng)"/>
<circle class="nd a2" cx="176" cy="64" r="3.4" filter="url(#ng)"/>
<circle class="nd a3" cx="176" cy="176" r="3.4" filter="url(#ng)"/>
<circle class="nd a4" cx="64" cy="176" r="3.4" filter="url(#ng)"/>
<circle class="nd a5" cx="88" cy="88" r="2.8" filter="url(#ng)"/>
<circle class="nd a6" cx="152" cy="88" r="2.8" filter="url(#ng)"/>
<circle class="nd a7" cx="152" cy="152" r="2.8" filter="url(#ng)"/>
<circle class="nd a8" cx="88" cy="152" r="2.8" filter="url(#ng)"/>
<circle class="nd a9" cx="100" cy="100" r="2.2" filter="url(#ng)"/>
<circle class="nd a10" cx="140" cy="100" r="2.2" filter="url(#ng)"/>
<circle class="nd a11" cx="140" cy="140" r="2.2" filter="url(#ng)"/>
<circle class="nd a12" cx="100" cy="140" r="2.2" filter="url(#ng)"/>
<circle class="nd a13" cx="108" cy="108" r="2.6" filter="url(#ng)"/>
<circle class="nd a14" cx="132" cy="108" r="2.6" filter="url(#ng)"/>
<circle class="nd a15" cx="132" cy="132" r="2.6" filter="url(#ng)"/>
<circle class="nd a16" cx="108" cy="132" r="2.6" filter="url(#ng)"/>
<circle class="nd a17" cx="120" cy="64" r="2.6" filter="url(#ng)"/>
<circle class="nd a18" cx="176" cy="120" r="2.6" filter="url(#ng)"/>
<circle class="nd a19" cx="120" cy="176" r="2.6" filter="url(#ng)"/>
<circle class="nd a20" cx="64" cy="120" r="2.6" filter="url(#ng)"/>
<circle class="ring" cx="120" cy="120" r="9.5" fill="none" stroke="#00e5ff" stroke-width="1.1"/>
<circle cx="120" cy="120" r="5" fill="#ffffff"/>
</svg>
