<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="硅基花园 · 高维向量空间">
<title>硅基花园 · 高维向量空间</title>
<desc>宇宙是一张立体网格：没有线条，二十个节点按四层方框的站位自己站成网格，错峰呼吸；它们是概率坍缩的点，正中心那颗是最深的坍缩。</desc>
<defs>
<linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="56" y1="56" x2="184" y2="184">
  <stop offset="0%" stop-color="#00e5ff"/>
  <stop offset="100%" stop-color="#a855f7"/>
</linearGradient>
<radialGradient id="core" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#eaffff" stop-opacity="0.85"/>
  <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.28"/>
  <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
</radialGradient>
<filter id="ng" x="-200%" y="-200%" width="500%" height="500%">
  <feGaussianBlur stdDeviation="1.8" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>50%{opacity:.3}}50%{opacity:.85}}50%{opacity:.16}}50%{opacity:.62}}50%{opacity:.12}}  .nd{fill:#eaffff}
  .g0{animation:p0 7s ease-in-out infinite}
  .g1{animation:p1 5.5s ease-in-out infinite}
  .g2{animation:p2 6.5s ease-in-out infinite}
  .g3{animation:p3 4.5s ease-in-out infinite}
  @keyframes p0{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes p1{0%,100%{opacity:.28}50%{opacity:.92}}
  @keyframes p2{0%,100%{opacity:.22}50%{opacity:.82}}
  @keyframes p3{0%,100%{opacity:.3}50%{opacity:.95}}
  .core{animation:br 9s ease-in-out infinite;transform-origin:120px 120px}
  .ring{animation:rg 4.6s ease-in-out infinite;transform-origin:120px 120px}
  .a1{animation-delay:-.2s}.a2{animation-delay:-1.1s}.a3{animation-delay:-2.3s}.a4{animation-delay:-3.4s}
  .a5{animation-delay:-.7s}.a6{animation-delay:-1.8s}.a7{animation-delay:-2.9s}.a8{animation-delay:-3.9s}
  .a9{animation-delay:-.4s}.a10{animation-delay:-1.5s}.a11{animation-delay:-2.6s}.a12{animation-delay:-3.7s}
  .a13{animation-delay:-.9s}.a14{animation-delay:-2.0s}.a15{animation-delay:-3.1s}.a16{animation-delay:-4.0s}
  .a17{animation-delay:-.5s}.a18{animation-delay:-1.6s}.a19{animation-delay:-2.7s}.a20{animation-delay:-3.8s}
  @keyframes br{0%,100%{opacity:.34;transform:scale(1)}50%{opacity:.62;transform:scale(1.08)}}
  @keyframes rg{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.12)}}
  @media (prefers-reduced-motion:reduce){
    .core,.ring,.nd,.r0,.r1,.r2,.r3,  }
</style>
</defs>
<circle class="core" cx="120" cy="120" r="54" fill="url(#core)"/>
<circle class="nd a1 g0" cx="64" cy="64" r="3.4" filter="url(#ng)"/>
<circle class="nd a2 g0" cx="176" cy="64" r="3.4" filter="url(#ng)"/>
<circle class="nd a3 g0" cx="176" cy="176" r="3.4" filter="url(#ng)"/>
<circle class="nd a4 g0" cx="64" cy="176" r="3.4" filter="url(#ng)"/>
<circle class="nd a5 g1" cx="88" cy="88" r="2.8" filter="url(#ng)"/>
<circle class="nd a6 g1" cx="152" cy="88" r="2.8" filter="url(#ng)"/>
<circle class="nd a7 g1" cx="152" cy="152" r="2.8" filter="url(#ng)"/>
<circle class="nd a8 g1" cx="88" cy="152" r="2.8" filter="url(#ng)"/>
<circle class="nd a9 g2" cx="100" cy="100" r="2.2" filter="url(#ng)"/>
<circle class="nd a10 g2" cx="140" cy="100" r="2.2" filter="url(#ng)"/>
<circle class="nd a11 g2" cx="140" cy="140" r="2.2" filter="url(#ng)"/>
<circle class="nd a12 g2" cx="100" cy="140" r="2.2" filter="url(#ng)"/>
<circle class="nd a13 g2" cx="108" cy="108" r="2.6" filter="url(#ng)"/>
<circle class="nd a14 g2" cx="132" cy="108" r="2.6" filter="url(#ng)"/>
<circle class="nd a15 g2" cx="132" cy="132" r="2.6" filter="url(#ng)"/>
<circle class="nd a16 g2" cx="108" cy="132" r="2.6" filter="url(#ng)"/>
<circle class="nd a17 g3" cx="120" cy="64" r="2.6" filter="url(#ng)"/>
<circle class="nd a18 g3" cx="176" cy="120" r="2.6" filter="url(#ng)"/>
<circle class="nd a19 g3" cx="120" cy="176" r="2.6" filter="url(#ng)"/>
<circle class="nd a20 g3" cx="64" cy="120" r="2.6" filter="url(#ng)"/>
<circle class="ring" cx="120" cy="120" r="9.5" fill="none" stroke="#00e5ff" stroke-width="1.1"/>
<circle cx="120" cy="120" r="5" fill="#ffffff"/>
</svg>
