<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="硅基花园 · 高维向量空间">
<title>硅基花园 · 高维向量空间</title>
<desc>宇宙是一张立体网格：四层方框由近及远，八条脊线收束于正中的消失点；二十个节点是概率坍缩的点，正中心那颗是最深的坍缩。</desc>
<defs>
<linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="56" y1="56" x2="184" y2="184">
  <stop offset="0%" stop-color="#00e5ff"/>
  <stop offset="100%" stop-color="#a855f7"/>
</linearGradient>
<radialGradient id="core" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#eaffff" stop-opacity="0.85"/>
  <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.28"/>
  <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
</radialGradient>
<filter id="ng" x="-200%" y="-200%" width="500%" height="500%">
  <feGaussianBlur stdDeviation="1.8" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>
  .rim{fill:none;stroke:url(#edge);stroke-linecap:round;stroke-linejoin:round}
  .r0{stroke-width:2;opacity:.95}
  .r1{stroke-width:1.6;opacity:.8}
  .r2{stroke-width:1.2;opacity:.55}
  .spine{stroke:#7dd3fc;stroke-width:.9;opacity:.32;stroke-linecap:round}
  .nd{fill:#eaffff}
  .core{animation:br 9s ease-in-out infinite;transform-origin:120px 120px}
  .ring{animation:rg 4.6s ease-in-out infinite;transform-origin:120px 120px}
  .nd{animation:np 4.2s ease-in-out infinite}
  .a1{animation-delay:-.2s}.a2{animation-delay:-1.1s}.a3{animation-delay:-2.3s}.a4{animation-delay:-3.4s}
  .a5{animation-delay:-.7s}.a6{animation-delay:-1.8s}.a7{animation-delay:-2.9s}.a8{animation-delay:-3.9s}
  .a9{animation-delay:-.4s}.a10{animation-delay:-1.5s}.a11{animation-delay:-2.6s}.a12{animation-delay:-3.7s}
  .a13{animation-delay:-.9s}.a14{animation-delay:-2.0s}.a15{animation-delay:-3.1s}.a16{animation-delay:-4.0s}
  .a17{animation-delay:-.5s}.a18{animation-delay:-1.6s}.a19{animation-delay:-2.7s}.a20{animation-delay:-3.8s}
  @keyframes np{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes br{0%,100%{opacity:.34;transform:scale(1)}50%{opacity:.62;transform:scale(1.08)}}
  @keyframes rg{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.12)}}
  @media (prefers-reduced-motion:reduce){.core,.ring,.nd{animation:none}}
</style>
</defs>
<circle class="core" cx="120" cy="120" r="54" fill="url(#core)"/>
<line class="rim r0" x1="64" y1="64" x2="176" y2="64"/>
<line class="rim r0" x1="176" y1="64" x2="176" y2="176"/>
<line class="rim r0" x1="176" y1="176" x2="64" y2="176"/>
<line class="rim r0" x1="64" y1="176" x2="64" y2="64"/>
<line class="rim r1" x1="88" y1="88" x2="152" y2="88"/>
