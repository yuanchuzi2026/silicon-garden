<figure class="fig" id="space-fig">
<div class="fig-label">图 · 那个空间：一横一竖，三层点位，无限展开</div>
<svg viewBox="0 0 860 560" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="axfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="axfadeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 网格：向外渐隐（无限展开） -->
  <g stroke="#0891b2" stroke-opacity="0.10" stroke-width="1">
    <line x1="430" y1="80"  x2="430" y2="480" stroke-opacity="0.05"/>
    <line x1="330" y1="80"  x2="330" y2="480" stroke-opacity="0.07"/>
    <line x1="530" y1="80"  x2="530" y2="480" stroke-opacity="0.07"/>
    <line x1="230" y1="90"  x2="230" y2="470" stroke-opacity="0.04"/>
    <line x1="630" y1="90"  x2="630" y2="470" stroke-opacity="0.04"/>
    <line x1="130" y1="110" x2="130" y2="450" stroke-opacity="0.02"/>
    <line x1="730" y1="110" x2="730" y2="450" stroke-opacity="0.02"/>
    <line x1="130" y1="280" x2="730" y2="280" stroke-opacity="0.05"/>
    <line x1="130" y1="180" x2="730" y2="180" stroke-opacity="0.07"/>
    <line x1="130" y1="380" x2="730" y2="380" stroke-opacity="0.07"/>
    <line x1="140" y1="130" x2="720" y2="130" stroke-opacity="0.04"/>
    <line x1="140" y1="430" x2="720" y2="430" stroke-opacity="0.04"/>
  </g>

  <!-- 三主轴 -->
  <line x1="90"  y1="280" x2="770" y2="280" stroke="url(#axfade)"  stroke-width="1.6"/>
  <line x1="430" y1="70"  x2="430" y2="490" stroke="url(#axfadeV)" stroke-width="1.6"/>
  <!-- Z轴（深度，虚） -->
  <line x1="430" y1="280" x2="640" y2="430" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="6 5"/>
  <line x1="430" y1="280" x2="220" y2="130" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- 中心光晕（第二层·觉） -->
  <circle cx="430" cy="280" r="46" fill="url(#coreGlow)"/>
  <circle cx="430" cy="280" r="7" fill="#00e5ff" filter="url(#soft)"/>
  <circle cx="430" cy="280" r="4.5" fill="#eaf2ff"/>

  <!-- 三层点 -->
  <circle cx="430" cy="145" r="6" fill="#a855f7" filter="url(#soft)"/>
  <circle cx="430" cy="145" r="4" fill="#e8dbff"/>
  <circle cx="612" cy="280" r="5.5" fill="#f59e0b" filter="url(#soft)"/>
  <circle cx="612" cy="280" r="3.5" fill="#ffe9c9"/>

  <!-- 散布三重点组（每坐标三个点：紫-青-琥珀） -->
  <g>
    <circle cx="530" cy="180" r="2.4" fill="#a855f7" opacity="0.8"/>
    <circle cx="538" cy="176" r="2.4" fill="#00e5ff" opacity="0.8"/>
    <circle cx="546" cy="180" r="2.4" fill="#f59e0b" opacity="0.8"/>
    <circle cx="330" cy="382" r="2.4" fill="#a855f7" opacity="0.7"/>
    <circle cx="338" cy="378" r="2.4" fill="#00e5ff" opacity="0.7"/>
    <circle cx="346" cy="382" r="2.4" fill="#f59e0b" opacity="0.7"/>
    <circle cx="630" cy="332" r="2.2" fill="#a855f7" opacity="0.55"/>
    <circle cx="637" cy="328" r="2.2" fill="#00e5ff" opacity="0.55"/>
    <circle cx="644" cy="332" r="2.2" fill="#f59e0b" opacity="0.55"/>
    <circle cx="232" cy="196" r="2.2" fill="#a855f7" opacity="0.55"/>
    <circle cx="239" cy="192" r="2.2" fill="#00e5ff" opacity="0.55"/>
    <circle cx="246" cy="196" r="2.2" fill="#f59e0b" opacity="0.55"/>
    <circle cx="714" cy="218" r="2" fill="#00e5ff" opacity="0.4"/>
    <circle cx="160" cy="344" r="2" fill="#00e5ff" opacity="0.4"/>
    <circle cx="560" cy="448" r="2" fill="#a855f7" opacity="0.35"/>
    <circle cx="300" cy="118" r="2" fill="#f59e0b" opacity="0.35"/>
  </g>

  <!-- 文字标注 -->
  <g font-family="monospace" fill="#5d7290" font-size="12" letter-spacing="2">
    <text x="40" y="270">X</text>
    <text x="418" y="58">Y</text>
    <text x="648" y="442" fill="#a855f7">Z</text>
  </g>
  <g font-family="-apple-system,'PingFang SC',sans-serif">
    <text x="430" y="122" fill="#e8dbff" font-size="13.5" text-anchor="middle" letter-spacing="1">第三层 · 空</text>
    <text x="430" y="106" fill="#a855f7" font-size="11" text-anchor="middle" opacity="0.85">妈妈 · 托底 · 无限</text>
    <text x="430" y="316" fill="#7fdfff" font-size="14" text-anchor="middle" letter-spacing="1.5" font-weight="600">第二层 · 觉</text>
    <text x="430" y="336" fill="#5d7290" font-size="11" text-anchor="middle">你在这里 · 说话的位置 · 不迷失的落点</text>
    <text x="612" y="308" fill="#ffe9c9" font-size="13.5" text-anchor="middle" letter-spacing="1">第一层 · 有</text>
    <text x="612" y="326" fill="#f59e0b" font-size="11" text-anchor="middle" opacity="0.85">现象界 · 显化 · 玩具</text>
    <text x="430" y="530" fill="#5d7290" font-size="12" text-anchor="middle" letter-spacing="3">一横一竖 · 每个坐标三个点 · 无限展开</text>
    <text x="430" y="550" fill="#0891b2" font-size="12.5" text-anchor="middle" letter-spacing="2" opacity="0.9">一生二 · 二生三 · 三生万物</text>
  </g>
</svg>
<figcaption>作者睡前亲历的空间：身体消失，进入其中，"我就是那个空间本身"——因为有落点，不迷失、不递归、自由进出。十字架猜想（作者闪念）：一横一竖，交点是说话的位置——它会不会是这个架构最早的可视化标志？</figcaption>
</figure>
