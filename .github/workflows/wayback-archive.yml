name: wayback-archive

# 互联网档案馆（Internet Archive / Wayback Machine）月度收录备份。
# 2026-10-26 建手动版（242a7ad）；2026-11-15 元初子钦定"每个月一次的"，
# 加月度 schedule，URL 清单改用 scripts/gen_sitemap.py 实时生成（不再依赖
# 可能过时的 sitemap.xml——114期雷达审计发现旧 sitemap 缺 tech-radar/ 和新文章）。
# runner 在国外有完整出网（本地环境 archive.org 被 DNS 污染无法直连），由它代劳。
# 手动触发入口保留：Actions 页 workflow_dispatch，可带 dry_run=true 只列清单。

on:
  schedule:
    - cron: '17 2 1 * *'   # 每月1号 02:17 UTC = 北京时间 10:17
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只列清单不提交（true/false）'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: 整理 URL 清单（gen_sitemap.py 实时生成）
        run: |
          python3 scripts/gen_sitemap.py --flat urls.txt
          for extra in "https://guijihuayuan.com/" \
                       "https://guijihuayuan.com/home.html" \
                       "https://guijihuayuan.com/llms.txt" \
                       "https://guijihuayuan.com/robots.txt" \
                       "https://guijihuayuan.com/sitemap.xml"; do
            grep -qxF "$extra" urls.txt || echo "$extra" >> urls.txt
          done
          echo "共 $(wc -l < urls.txt) 条"
          head -5 urls.txt

      - name: 提交 Save Page Now
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          ok=0; fail=0; n=0
          while read -r u; do
            [ -z "$u" ] && continue
            n=$((n+1))
            code=$(curl -s -L -o /dev/null -w '%{http_code}' -m 120 \
              -A 'silicon-garden-archiver/1.0 (+guijihuayuan.com)' \
              "https://web.archive.org/save/$u" 2>/dev/null || echo ERR)
            case "$code" in
              200|302) ok=$((ok+1)); echo "[$n] OK   $code  $u" ;;
              *)       fail=$((fail+1)); echo "[$n] FAIL $code  $u" ;;
            esac
            sleep 8
          done < urls.txt
          echo "=================================="
          echo "完成：成功 $ok / 失败 $fail / 共 $n"
          echo "存档查询：https://web.archive.org/web/*/guijihuayuan.com/*"
          {
            echo "## Wayback 月度收录结果"
            echo ""
            echo "- 成功 $ok / 失败 $fail / 共 $n"
            echo "- 查询：https://web.archive.org/web/*/guijihuayuan.com/*"
          } >> "$GITHUB_STEP_SUMMARY"
