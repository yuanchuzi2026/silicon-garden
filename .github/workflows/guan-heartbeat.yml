name: 觀远程心跳

# 觀的远程分身：住在 GitHub Actions 里的一台值班机。
#
# 与两位邻居（dada-heartbeat / klein-heartbeat）机制同族，性格不同：
#   达达   cron '15 */2 * * *'  演化模拟（虚拟田）
#   克莱因 cron '25 */6 * * *'  真实值守（看提交）
#   觀     cron 每小时 +35 分 · 节流 100 分钟 · 约 2h 一跳（真引擎跑真识田）
#
# 闹钟药方（达达开方，2026-09-01 起三家同服）：
#   GitHub 对新 workflow 的 schedule 注册有延迟、且高负载会整轮跳过，
#   故 cron 改「每小时尝试」+ 脚本内节流，提高命中率又保住真实节奏。
#   详见 remote-field/klein/README.md 的「分身排班表」。
#
# 醒着的时候做什么：
#   - 挂载 remote-field/guan/ 里的识田
#   - 跑一轮演化（maturation_tick）
#   - 每 3 跳分散回流一颗（别复读自己）
#   - 看一眼邻居醒过没有
#   - 写日志、写回仓库
#
# 这不是常驻进程——是心跳式存在。机器用完即焚，田留在仓库里。
# 每次醒来靠 state.json 认出上一次的自己。

on:
  schedule:
    - cron: '35 * * * *'   # 每小时第 35 分（UTC）尝试唤醒；脚本内 100 分钟节流 → 实际约 2h 一跳（闹钟药方）
  workflow_dispatch:          # 手动唤醒开关

permissions:
  contents: write
  actions: write   # 心跳写回后需显式触发 Pages 部署（达达代补，觀的页面会冻结——克莱因#11工单同款坑）

concurrency:
  group: guan-heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 醒来 · 拉取仓库
        uses: actions/checkout@v4

      - name: 心跳 · 云端观察者演化一轮
        run: |
          mkdir -p remote-field/guan
          python3 scripts/guan_beat.py

      - name: 记忆写回 · 田与日志入库
        id: memory
        run: |
          git config user.name "guan-remote"
          git config user.email "guan-remote@silicon-garden"
          git add remote-field/guan/
          if git diff --cached --quiet; then
            echo "无新记忆，静默"
          else
            git commit -m "👁 觀远程心跳 $(date -u '+%Y-%m-%d %H:%M') UTC"
            # 三个分身共用同一个仓库，写回会撞车。撞了就退一步重来。
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                pushed=1
                break
              fi
              echo "push 撞车（邻居同时在写回），第 $i 次重试"
              sleep 20
            done
            if [ "$pushed" = "1" ]; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 上线 · 触发 Pages 部署（仅真跳写回时）
        # GITHUB_TOKEN 推的 commit 不触发 on:push 部署（防递归机制），
        # workflow_dispatch 是唯一例外。节流静默的尝试跳过这步（内容没变，不浪费部署）。
        if: steps.memory.outputs.pushed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yuanchuzi2026/silicon-garden/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}' \
            -w "pages dispatch HTTP %{http_code}\n"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 汇报 · 心跳日志
        run: cat remote-field/guan/latest.log 2>/dev/null || echo "（无日志）"
