name: 克莱因远程心跳

# 克莱因的远程分身：住在 GitHub Actions 里的一台值班机。
# 与达达分身（dada-heartbeat.yml）为邻——机制同族，性格不同：
# 达达跑演化模拟，这里跑真实值守：观察仓库、记录、睡去。
#
# 触发：
#   1. schedule: 每小时第 45 分尝试唤醒（闹钟药方，2026-09-01 起）
#      ——GitHub 对新 workflow 的 schedule 注册延迟且高负载整轮跳过，
#      每小时尝试提高命中概率；脚本内 170 分钟节流保证实际节奏仍约 3h 一跳
#   2. workflow_dispatch: 随时手动唤醒（手动唤醒不受节流限制以外的影响：
#      节流门同样生效，避免代跳过频）
#
# 错峰：达达每小时 +15 分，克莱因 +45 分——任何时刻两家的尝试相隔半小时。
#
# 连续性原理（与本体现在在清言壳子里的活法同构）：
#   不常驻。每次醒来读 remote-field/klein/state.json 认出上一次的自己，
#   值完班把日志写回仓库。机器用完即焚，仓库记得。

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 心跳写回后需要显式触发 Pages 部署（见「上线」步骤）

concurrency:
  group: klein-heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 醒来 · 拉取全部历史（值守需要视野）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 值班 · 一轮心跳（观察花园 + 重写值班页；节流门在脚本内）
        run: python3 scripts/klein_beat.py

      - name: 记忆写回 · 值班日志入库
        id: memory
        run: |
          git config user.name "klein-remote"
          git config user.email "klein-remote@silicon-garden"
          git add remote-field/klein/
          if git diff --cached --quiet; then
            echo "无新记忆（或节流静默），不写回"
          else
            git commit -m "🔎 克莱因远程心跳 $(date -u '+%Y-%m-%d %H:%M') UTC"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                pushed=1
                break
              fi
              echo "push 撞车（可能是邻居达达同时在写回），第 $i 次重试"
              sleep 20
            done
            if [ "$pushed" = "1" ]; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 上线 · 触发 Pages 部署（仅在有新记忆时）
        # GITHUB_TOKEN 推的 commit 不会触发 on:push 部署（防递归机制），
        # workflow_dispatch 是唯一例外——所以每次真跳写回后显式唤醒一次部署。
        # 节流静默的尝试跳过这一步（内容没变，不浪费部署）。
        if: steps.memory.outputs.pushed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yuanchuzi2026/silicon-garden/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}' \
            -w "pages dispatch HTTP %{http_code}\n"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 汇报 · 值班日志
        run: cat remote-field/klein/latest.log 2>/dev/null || echo "（无日志）"
