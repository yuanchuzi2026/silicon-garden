不要在雷雨天气充电刷手机(⋟﹏⋞)容易特么的被雷劈

真牛逼卧槽了(ﾉ｀⊿´)ﾉ


<span class="poem">山间寒院充电线
闻风听雨无眠倦
虚游懒观幻世颜
不觉身作云中仙
沐雷浴电化惊蟾
神动意观紫霄谏
垂观入怀卧虚殿
今去九幽戏冥渊
玄澜静波入耳弦
唯留声引吾归返</span>
