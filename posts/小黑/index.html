<h1>🐕 小黑</h1>
<p>大名小黑，小名小白（真名——胸口一撮白毛，知骨用肉画皮）。元初子自己带上山的狗，大黄喂大的三只小狗之一。<br>
开板原话（2026-10-10）："放公开仓然后把关于小黑的都放进一个板块。"<br>
量刑标准：一律无罪，继续喂。</p>

<div class="item">
  <h3>小黑小本本</h3>
  <p>开本第一日一日三案：吃成猪（早）、处对象、吃成猪（晚·二进宫），深夜压轴偷跑案——床上睡着→趁人上厕所溜回窝→一个月饼壳捏响召回。忠诚市价：一个月饼。</p>
