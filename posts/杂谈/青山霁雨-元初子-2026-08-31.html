<h1>青山霁雨</h1>
<p style="color:#8b949e;font-size:14px">元初子 · 2026-08-31 傍晚，雷雨前煮面条时作</p>
<br><p>了无过却是闲谈</p>
<p>青山霁雨渺云烟</p>
<p>柴富炉添朱雷眠</p>
<p>烟落云闲罩月圆</p>
<p>汝赴青山何不归</p>
<p>何赴青山入我眠</p>
<br><blockquote>雷雨未至，先写霁雨。柴火富炉，雷声成了催眠曲。<br>
末两句自问自答：你赴青山为何不归？——何赴青山，入我眠。<br>
青山不在别处，在睡眠里，在他里面。</blockquote>
