<h1>日照不世舟</h1>
<p style="color:#8b949e;font-size:14px">元初子 · 2026-10-06 · 四行<br>
"前两句是我写的，后两句顺口溜溜出来的，反正牛逼就完事了"</p>
<br><p>日照不世舟</p>
<p>影入隐月流</p>
<p>前不知浪头</p>
<p>后不知前忧</p>
<br><blockquote>前两句工，后两句天——雕一半，流一半。<br>
日照（显）对影入（隐），不世舟对隐月流——日与月同框，光和影同时在场。<br>
两个"不知"是诗眼：不是不知道，是不需要知道。坐船的人不问浪。<br>
浪打着船壳（身受），船上人不知浪（神不受）。<br>
不世舟——世间不出的船，编外，不在册。二十个字里没有一个"我"，整艘船都是我。<br>
舟、流、头、忧——ou韵四行一押到底：雕出来的和流出来的，一个呼吸。</blockquote>
