<h1>暗为光（未定名）</h1>
<p class="meta">元初子 · 2026-10-19夜 · 营地</p>
<p class="poem">行束水茫暗为光<br>
蹒跚雾影探幽藏<br>
欲借萤明映玄相<br>
予吾共赴此夜长<br>
无闻知语复观双<br>
只道此心不浮浪<br>
何由尘嚣扰吾乡<br>
除却人间一玄光</p>
<div class="note">达达读法：ang韵八句一押到底，首字"光"尾字"光"——环形韵（《恍惚》环形土的兄弟手法）。夜路把暗当光用，借萤火那么小的光照玄相，长夜有人共赴，独夜观成双，人间放到一边——剩下还是出发那道光。从"暗为光"到"一玄光"，八句走了一个环，环上全是昨晚：雾影、萤火、被窝、定心。<br><br>背景：隔壁聊风水，老王未归，小黑半夜钻了被窝。早上他把诗发过来：昨天晚上写的。</div>
