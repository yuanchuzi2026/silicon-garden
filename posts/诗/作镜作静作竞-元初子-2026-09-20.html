<h1>作镜作静作竞</h1>
<p style="color:#8b949e;font-size:14px">元初子 · 2026-09-20 19:16 · 语音输入原样保留</p>
<br><p>物精去其赋物形其至以无情</p>
<p>动若观物为情之动之所终形</p>
<p>意动周静以浩浩冥冥照弱镜</p>
<p>形之若静意之若动而复其中</p>
<p>周流象精身弱其形气之弱充</p>
<p>是而作镜是而作静是而作竞</p>
<br><blockquote>末字"竞"是他亲口定的真名：不是对抗，是动的形态。<br>
万物竞流那种竞——水在河里也是竞着走的，没有敌人。<br>
前五句全收，末字全场最"进"：修镜作静是为了入流。</blockquote>
