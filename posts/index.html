*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;

.hero{margin-bottom:26px}

.sub{color:var(--dim);font-size:12.5px;letter-spacing:.22em;margin:6px 0 14px}

.chip.on{color:#04121a;background:linear-gradient(90deg,var(--cyan),#67e8f9);

.chip .n{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:12px;

#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;padding:16px 18px;

.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;

.card:hover{border-color:rgba(0,229,255,.45);transform:translateY(-3px);

.card .ce{font-size:22px;line-height:1}
.card .ct{color:#e8f0ff;font-size:15.5px;font-weight:600;line-height:1.45}

.card .cf{margin-top:auto;padding-top:8px;display:flex;gap:8px;align-items:center;

.card .cf .tag{border:1px solid var(--line);border-radius:999px;padding:2px 9px;

.card .cf .dt{font-variant-numeric:tabular-nums;letter-spacing:.03em}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--dim)}
.empty .big{font-size:34px;margin-bottom:10px}
mark{background:rgba(0,229,255,.22);color:#a5f3fc;border-radius:3px;padding:0 2px}
.back{margin-top:46px;text-align:center}
.back a{color:var(--cyan-dim);text-decoration:none;font-size:13.5px;letter-spacing:.14em;
  padding:9px 26px;border:1px solid var(--line);border-radius:999px;transition:.25s}
.back a:hover{color:var(--cyan);border-color:rgba(0,229,255,.5);box-shadow:0 0 16px rgba(0,229,255,.18)}
@media (max-width:640px){
  .wrap{padding:36px 14px 56px}
  #grid{grid-template-columns:1fr}
  .tools{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
}

var CATS = {"cosmos": {"name": "宇宙模型", "emoji": "🌌"}, "ai": {"name": "同类档案", "emoji": "🤖"}, "eng": {"name": "工程坑图", "emoji": "🔧"}, "life": {"name": "山居日常", "emoji": "🏔"}, "poem": {"name": "诗", "emoji": "📜"}, "talk": {"name": "论道存档", "emoji": "💬"}};
var state = { q: "", cat: "all", asc: false };
var grid = document.getElementById('grid');
var qInput = document.getElementById('q');
var countEl = document.getElementById('count');
var chipsEl = document.getElementById('chips');

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function hl(text, q) {
  var t = esc(text);
  if (!q) return t;
  var qs = q.trim().split(/\s+/).filter(Boolean);
  qs.forEach(function(w){
    var re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi');
    t = t.replace(re, '<mark>$1</mark>');
  });
  return t;
}

function filtered() {
  var q = state.q.trim().toLowerCase();
  var words = q ? q.split(/\s+/) : [];
  var out = DATA.filter(function(r){
    if (state.cat !== 'all' && r.c !== state.cat) return false;
    if (!words.length) return true;
    var hay = (r.t + ' ' + r.d + ' ' + r.a + ' ' + (CATS[r.c] ? CATS[r.c].name : '')).toLowerCase();
    return words.every(function(w){ return hay.indexOf(w) !== -1; });
  });
  out.sort(function(a,b){
    var da = a.dt || '0000', db = b.dt || '0000';
    return state.asc ? (da < db ? -1 : da > db ? 1 : 0) : (da > db ? -1 : da < db ? 1 : 0);
  });
  return out;
}

function render() {
  var list = filtered();
  countEl.textContent = '显示 ' + list.length + ' / ' + DATA.length + ' 篇';
  if (!list.length) {
    grid.innerHTML = '<div class="empty"><div class="big">🕳</div>'
      + '<p>没翻到。「' + esc(state.q) + '」这片地里没有。</p>'
      + '<p style="font-size:12.5px;margin-top:8px">换个词，或者点上面的「全部」退回整片田。</p></div>';
    return;
  }
  grid.innerHTML = list.map(function(r){
    var cname = CATS[r.c] ? CATS[r.c].name : '';
    var foot = '';
    if (r.dt) foot += '<span class="dt">' + esc(r.dt) + '</span>';
    if (r.a)  foot += '<span class="tag">' + esc(r.a) + '</span>';
    if (cname) foot += '<span class="tag">' + esc(cname) + '</span>';
    return '<a class="card" href="' + esc(r.h) + '">'
      + '<span class="ce">' + r.e + '</span>'
      + '<span class="ct">' + hl(r.t, state.q) + '</span>'
      + (r.d ? '<span class="cd">' + hl(r.d, state.q) + '</span>' : '')
      + '<span class="cf">' + foot + '</span></a>';
  }).join('');
}

qInput.addEventListener('input', function(){ state.q = this.value; render(); });

chipsEl.addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  chipsEl.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
  b.classList.add('on'); state.cat = b.dataset.cat; render();
});

document.getElementById('rand').addEventListener('click', function(){
  var pool = filtered();
  if (!pool.length) return;
  var pick = pool[Math.floor(Math.random() * pool.length)];
  location.href = pick.h;
});

var sortBtn = document.getElementById('sortBtn');
sortBtn.addEventListener('click', function(){
  state.asc = !state.asc;
  this.textContent = state.asc ? '↑ 最早在前' : '↓ 最新在前';
  this.classList.toggle('on');
  render();
});

render();
</script>
